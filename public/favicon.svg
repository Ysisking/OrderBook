<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>OrderBook</title>
  <!-- Ikon: tiket pesanan dijepit di tali jendela antara dapur dan kasir -->
  <rect width="64" height="64" rx="15" fill="#2a78d6"/>
  <!-- tali / rel tiket -->
  <path d="M7 15.5 Q32 19.5 57 15.5" fill="none" stroke="#cde2fb" stroke-width="2.6" stroke-linecap="round"/>
  <circle cx="7" cy="15.5" r="2.6" fill="#ffffff"/>
  <circle cx="57" cy="15.5" r="2.6" fill="#ffffff"/>
  <!-- kertas tiket, sedikit miring, tepi bawah sobekan -->
  <g transform="rotate(-5 32 36)">
    <path d="M18 21 H46 V51 l-3.5 3 -3.5 -3 -3.5 3 -3.5 -3 -3.5 3 -3.5 -3 -3.5 3 -3.5 -3 Z" fill="#ffffff"/>
    <rect x="22" y="28" width="13" height="3" rx="1.5" fill="#0d366b"/>
    <rect x="22" y="34.5" width="20" height="2.2" rx="1.1" fill="#9ec5f4"/>
    <rect x="22" y="39.5" width="16" height="2.2" rx="1.1" fill="#9ec5f4"/>
    <rect x="22" y="44.5" width="9" height="2.2" rx="1.1" fill="#9ec5f4"/>
    <circle cx="40.5" cy="45.6" r="2.4" fill="#0ca30c"/>
  </g>
  <!-- penjepit kayu -->
  <rect x="28.2" y="9" width="7.6" height="17" rx="2.2" fill="#f2a33a"/>
  <rect x="31.2" y="9" width="1.6" height="17" fill="#c7781a"/>
  <circle cx="32" cy="17.6" r="2" fill="#ffffff" stroke="#c7781a" stroke-width="1"/>
</svg>
